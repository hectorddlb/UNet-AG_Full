[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unetag-1pw-bmode"
version = "1.0.0"
description = "Ultrasound B-mode reconstruction from a single plane wave with a UNet informed by the frequency-dependent F-number (and the replica of the DRUS diffusion method it is compared with)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Héctor David De Lara Berumen" }]
keywords = ["ultrasound", "beamforming", "plane-wave", "deep-learning", "b-mode"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
picmus = ["h5py>=3.8"]            # read PICMUS RF files
figures = ["matplotlib>=3.7"]      # PNG output
drus   = ["h5py>=3.8", "matplotlib>=3.7"]   # replica of the diffusion method (`drus` command)
drus-training = ["blobfile>=2.0", "tqdm>=4.65", "mkl"]   # prior fine-tuning and SVD (MKL ILP64)
all    = ["h5py>=3.8", "matplotlib>=3.7", "blobfile>=2.0", "tqdm>=4.65"]

[project.scripts]
unetag = "unet_ag.cli:main"
drus = "drus.cli:main"

[project.urls]
Repository = "https://github.com/hectorddlb/UNet-AG_Full"

[tool.setuptools]
package-dir = { "" = "code" }

[tool.setuptools.packages.find]
where = ["code"]
include = ["unet_ag*", "schiffner_das*", "drus*", "guided_diffusion*"]

[tool.setuptools.package-data]
unet_ag = ["py.typed"]
